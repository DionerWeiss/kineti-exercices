<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lote de exemplo — Kineti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #F1F5F9;
    --surface: #FFFFFF;
    --surface-sub: #F8FAFC;
    --stage: #F2F5FB;
    --fg: #0D1B2A;
    --muted: #4A5568;
    --line: #E3E8EE;
    --accent: #2563EB;
    --accent-soft: #DCE7FE;
    --accent-ink: #1E40AF;
    --font: "Poppins", "Segoe UI", system-ui, sans-serif;
    --role-figure: #2563EB;
    --role-figure-back: #9DB9F6;
    --role-figure-active: #FF6D00;
    --role-figure-active-back: #FFC08F;
    --role-prop: #4A5568;
    --role-prop-soft: #E2E8F0;
    --role-floor: #DDE3EA;
    --role-floor-plane: #E2E8F0;
    --role-guide: #4A5568;
    --role-marker: #FF6D00;
    --role-highlight: #2563EB;
    --role-shadow: #0D1B2A;
    --role-stage: #F2F5FB;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 3vw, 2.2rem); letter-spacing: -0.02em; }
  .lead { margin: 0 0 28px; color: var(--muted); max-width: 68ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; }
  article { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; align-content: start; }
  .stage { background: #fff; border-radius: 10px; aspect-ratio: 1; overflow: hidden; cursor: pointer; }
  .stage svg { display: block; width: 100%; height: 100%; }
  .head { display: grid; gap: 4px; }
  h2 { margin: 0; font-size: 1.02rem; }
  .chip { display: inline-flex; font-size: 0.72rem; font-weight: 500; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); }
  .desc { margin: 0; font-size: 0.88rem; }
  .meta { margin: 0; color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Lote de exemplo</h1>
  <p class="lead">Oito tutoriais no desenho chapado: regata coral, short escuro, tênis com sola verde e sombra no chão. O movimento é o da biblioteca; o traço é original. Clique para pausar.</p>
  <div class="grid" id="grid"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script>
const SAMPLE = [
  { slug: 'heel_slides', area: 'joelhos', name: 'Deslizamento do calcanhar', place: 'Deitado', props: 'Colchonete', desc: 'Deitado, pernas estendidas. Desliza um calcanhar em direção ao quadril até apoiar a sola, sem tirá-lo do colchonete, e volta a estender a perna devagar.' },
  { slug: 'bridge', area: 'quadril_gluteos', name: 'Ponte', place: 'Deitado', props: 'Colchonete', desc: 'Deitado, joelhos flexionados e pés apoiados. Eleva o quadril até alinhar ombros, quadril e joelhos, segura e desce devagar.' },
  { slug: 'side_lying_clamshell', area: 'quadril_gluteos', name: 'Concha deitado de lado', place: 'De lado', props: 'Colchonete', desc: 'Deitado de lado, quadril e joelhos dobrados, pés juntos. Abre o joelho de cima como uma concha, sem separar os pés, e fecha devagar.' },
  { slug: 'seated_knee_extension', area: 'joelhos', name: 'Extensão de joelho sentado', place: 'Sentado', props: 'Cadeira', desc: 'Sentado com costas eretas e pés no chão. Estende lentamente um joelho, elevando o pé à frente, e retorna. A coxa permanece no assento.' },
  { slug: 'ankle_pumps', area: 'tornozelos_pes', name: 'Bombeamento de tornozelos', place: 'Deitado', props: 'Cama', desc: 'Deitado de costas, pernas estendidas. Movimenta os dois tornozelos lentamente, pontas dos pés para o corpo e depois para longe.' },
  { slug: 'cat_camel', area: 'tronco_coluna', name: 'Gato-camelo', place: 'Quatro apoios', props: 'Colchonete', desc: 'Em quatro apoios, arredonda as costas para cima deixando a cabeça descer, depois deixa as costas afundarem suavemente e volta ao neutro.' },
  { slug: 'single_leg_stance', area: 'equilibrio', name: 'Apoio unipodal', place: 'Em pé', props: 'Bancada', desc: 'Uma mão na bancada. Passa o peso para uma perna, tira o outro pé do chão com o joelho dobrado e se mantém. Depois apoia o pé.' },
  { slug: 'sit_to_stand_exercise', area: 'mobilidade_transferencias', name: 'Sentar e levantar', place: 'Transferência', props: 'Cadeira', desc: 'Sentado, braços cruzados e pés firmes. Inclina o tronco à frente, levanta até ficar em pé e senta de volta devagar.' }
];

const grid = document.getElementById('grid');
const autoplay = !matchMedia('(prefers-reduced-motion: reduce)').matches;

SAMPLE.forEach(ex => {
  const stage = document.createElement('div');
  stage.className = 'stage';
  stage.setAttribute('role', 'img');
  stage.setAttribute('aria-label', ex.name);
  const article = document.createElement('article');
  article.append(
    stage,
    Object.assign(document.createElement('div'), { className: 'head' })
  );
  const head = article.children[1];
  const chip = document.createElement('span');
  chip.className = 'chip';
  chip.textContent = `${ex.place} · ${ex.props}`;
  const h2 = document.createElement('h2');
  h2.textContent = ex.name;
  const desc = document.createElement('p');
  desc.className = 'desc';
  desc.textContent = ex.desc;
  head.append(chip, h2);
  article.append(desc);
  grid.append(article);

  fetch(`examples/estilo/${ex.slug}.json`, { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      const anim = lottie.loadAnimation({
        container: stage, renderer: 'svg', loop: true, autoplay,
        animationData: data,
        rendererSettings: { preserveAspectRatio: 'xMidYMid meet' }
      });
      stage.addEventListener('click', () => anim.isPaused ? anim.play() : anim.pause());
    })
    .catch(() => {
      stage.textContent = 'Não foi possível carregar a animação.';
    });
});
</script>
</body>
</html>
