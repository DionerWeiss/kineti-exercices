<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinh · azul Kineti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #F1F5F9;
    --surface: #FFFFFF;
    --fg: #0D1B2A;
    --muted: #4A5568;
    --line: #E3E8EE;
    --accent: #2563EB;
    --accent-soft: #DCE7FE;
    --accent-ink: #1E40AF;
    --font: "Poppins", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 3vw, 2.2rem); letter-spacing: -0.02em; }
  .lead { margin: 0 0 28px; color: var(--muted); max-width: 72ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; }
  article { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; align-content: start; }
  .stage { background: #fff; border-radius: 10px; aspect-ratio: 1; overflow: hidden; cursor: pointer; }
  .stage svg { display: block; width: 100%; height: 100%; }
  .head { display: grid; gap: 4px; }
  h2 { margin: 0; font-size: 1.02rem; }
  .chip { display: inline-flex; font-size: 0.72rem; font-weight: 500; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); }
  .desc { margin: 0; font-size: 0.88rem; }
  .meta { margin: 0; color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Dinh · azul Kineti</h1>
  <p class="lead">Seis loops do Dinh Bui Xuan com o movimento original. Só a regata (ou o tronco colorido) foi trocada pelo azul do Kineti. Clique para pausar. Créditos em <code>CREDITS.md</code>.</p>
  <div class="grid" id="grid"></div>
</div>
<script src="vendor/lottie.min.js"></script>
<script>
const SAMPLE = [
  { slug: 'forearm_stretch', name: 'Alongamento de antebraço', place: 'Em pé', desc: 'Estende um braço à frente e puxa a mão com a outra, alongando o antebraço.' },
  { slug: 'shoulder_stretch', name: 'Alongamento de ombro', place: 'Em pé', desc: 'Cruza um braço na frente do peito e puxa com o outro, alongando o ombro.' },
  { slug: 'cobra', name: 'Cobra', place: 'Deitado de bruços', desc: 'De bruços, apoia as mãos e eleva o tronco em extensão, depois desce.' },
  { slug: 'squat_reach', name: 'Agachamento com alcance', place: 'Em pé', desc: 'Agacha e sobe alcançando os braços para cima.' },
  { slug: 'reverse_crunches', name: 'Abdominal inverso', place: 'Deitado', desc: 'Deitado de costas, eleva o quadril e as pernas em direção ao peito e desce.' },
  { slug: 'step_up_on_chair', name: 'Subida na cadeira', place: 'Em pé', desc: 'Sobe com um pé na cadeira, sobe o outro e desce, alternando o ciclo.' }
];

const grid = document.getElementById('grid');
const autoplay = !matchMedia('(prefers-reduced-motion: reduce)').matches;

SAMPLE.forEach(ex => {
  const stage = document.createElement('div');
  stage.className = 'stage';
  stage.setAttribute('role', 'img');
  stage.setAttribute('aria-label', ex.name);
  const article = document.createElement('article');
  article.innerHTML = `
    <div class="head">
      <span class="chip">${ex.place}</span>
      <h2>${ex.name}</h2>
    </div>`;
  article.appendChild(stage);
  const desc = document.createElement('p');
  desc.className = 'desc';
  desc.textContent = ex.desc;
  article.appendChild(desc);
  const meta = document.createElement('p');
  meta.className = 'meta';
  meta.textContent = ex.slug + '.json';
  article.appendChild(meta);
  grid.appendChild(article);

  const anim = lottie.loadAnimation({
    container: stage,
    renderer: 'svg',
    loop: true,
    autoplay,
    path: ex.slug + '.json'
  });
  stage.addEventListener('click', () => {
    if (anim.isPaused) anim.play();
    else anim.pause();
  });
});
</script>
</body>
</html>
